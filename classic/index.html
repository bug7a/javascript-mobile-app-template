<!DOCTYPE html>
<html lang="en">
    <head>

        <meta charset="UTF-8">
        <!-- viewport-fit=cover: the app goes under the notch; App.safeArea keeps the header out of it -->

        <meta name="format-detection" content="telephone=no">
        <meta name="theme-color" content="#FFFFFF">

        <!-- MOBILE APP: Cordova adds cordova.js to the app: open its line. (Capacitor needs no line; only an old

        <!-- <script src="cordova.js" type="text/javascript" charset="utf-8"></script> -->

        <!-- LIBRARY -->
        <link rel="preload" href="basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">

        <link rel="stylesheet" type="text/css" href="basic/basic.min.css">

        <script src="app/app.js" type="text/javascript" charset="utf-8"></script>
